[project]
name = "psicoia-api"
version = "0.1.0"
description = "API del Copiloto Terapéutico PsicoIA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlmodel>=0.0.39",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.18.5",
    # psycopg 3 (no asyncpg): acepta el `?sslmode=require` que entregan Neon y
    # Supabase sin tener que parsear la URL, y sirve tanto para el engine async
    # de la app como para el modo sync de Alembic.
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "google-genai>=2.16.0",
    # SQLAlchemy async lo necesita para el puente sync/async.
    "greenlet>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones son código en su mayoría autogenerado: el formato lo dicta
# Alembic, no tiene sentido pelearle al ancho de línea.
"alembic/versions/*" = ["E501"]
# Scripts operativos: SQL literal y mensajes de diagnóstico largos.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
